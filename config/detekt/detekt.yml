# Sobre la config por defecto de detekt (buildUponDefaultConfig = true).
# Solo se ajusta lo que choca con Compose / el estilo del proyecto.
config:
  validation: false

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreNamedArgument: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  WildcardImport:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotated: ['Composable']
